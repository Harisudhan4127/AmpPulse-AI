; AmpPulse AI - ESP32 firmware
; PlatformIO project file. Open this folder in VS Code with the
; PlatformIO extension, or use `pio run` / `pio run -t upload` from CLI.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

build_flags =
    -DCORE_DEBUG_LEVEL=3
